<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Cursor Dance Party </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      overflow: hidden;
      background: #0a0a12;
      cursor: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      width: 100vw;
    }


    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }


    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      color: white;
      text-shadow: 0 0 10px rgba(255,100,255,0.8);
    }


    h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ff00cc, #00ffcc, #ffcc00, #ff00cc);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 4s linear infinite;
      margin-bottom: 8px;
    }


    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }


    .hint {
      font-size: 0.95rem;
      opacity: 0.85;
      letter-spacing: 1px;
    }


    #score {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0,0,0,0.45);
      padding: 8px 20px;
      border-radius: 30px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
      pointer-events: none;
    }


    .custom-cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 10%, #ff00cc 40%, transparent 70%);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      box-shadow: 0 0 20px #ff00cc, 0 0 40px #00ffcc;
      transition: width 0.1s, height 0.1s;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1> CURSOR DANCE PARTY </h1>
    <div class="hint">Move your mouse • Click to explode • Press Space for confetti storm</div>
  </div>
  <div id="score">Particles: 0</div>
  <div class="custom-cursor" id="cursor"></div>
  <canvas id="c"></canvas>


  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');
    const scoreEl = document.getElementById('score');


    let W, H;
    let mouse = { x: -100, y: -100 };
    let particles = [];
    let dancers = [];
    let trails = [];
    let beat = 0;
    let lastTime = 0;


    // Colors for the party
    const colors = [
      '#ff00cc', '#00ffcc', '#ffcc00', '#00ccff',
      '#ff6600', '#cc00ff', '#66ff00', '#ff0066',
      '#00ff99', '#ff99ff'
    ];


    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();


    // Custom cursor follow
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top = e.clientY + 'px';


      // Spawn trail particles
      for (let i = 0; i < 3; i++) {
        particles.push(createParticle(mouse.x, mouse.y, 'trail'));
      }
    });


    window.addEventListener('mousedown', e => {
      // Explode on click
      for (let i = 0; i < 40; i++) {
        particles.push(createParticle(e.clientX, e.clientY, 'explode'));
      }
      // Spawn a few dancers
      for (let i = 0; i < 5; i++) {
        dancers.push(createDancer(e.clientX, e.clientY));
      }
      cursorEl.style.width = '50px';
      cursorEl.style.height = '50px';
      setTimeout(() => {
        cursorEl.style.width = '28px';
        cursorEl.style.height = '28px';
      }, 150);
    });


    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        // Confetti storm
        for (let i = 0; i < 120; i++) {
          particles.push(createParticle(
            Math.random() * W,
            Math.random() * H * 0.3,
            'confetti'
          ));
        }
      }
    });


    function createParticle(x, y, type) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      let vx, vy, life, size, shape;


      if (type === 'trail') {
        vx = (Math.random() - 0.5) * 4;
        vy = (Math.random() - 0.5) * 4;
        life = 0.6 + Math.random() * 0.4;
        size = 2 + Math.random() * 4;
        shape = 'circle';
      } else if (type === 'explode') {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 10;
        vx = Math.cos(angle) * speed;
        vy = Math.sin(angle) * speed;
        life = 1 + Math.random() * 0.8;
        size = 3 + Math.random() * 6;
        shape = Math.random() > 0.6 ? 'star' : 'circle';
      } else { // confetti
        vx = (Math.random() - 0.5) * 8;
        vy = 2 + Math.random() * 6;
        life = 2 + Math.random() * 2;
        size = 4 + Math.random() * 8;
        shape = Math.random() > 0.5 ? 'rect' : 'circle';
      }


      return { x, y, vx, vy, life, maxLife: life, size, color, type, shape, rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 15 };
    }


    function createDancer(x, y) {
      return {
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        size: 18 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)],
        bounce: 0,
        phase: Math.random() * Math.PI * 2,
        life: 8 + Math.random() * 6
      };
    }


    // Initial dancers floating around
    for (let i = 0; i < 12; i++) {
      dancers.push(createDancer(Math.random() * W, Math.random() * H));
    }


    function drawStar(cx, cy, spikes, outer, inner) {
      let rot = Math.PI / 2 * 3;
      let x = cx, y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outer);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outer;
        y = cy + Math.sin(rot) * outer;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * inner;
        y = cy + Math.sin(rot) * inner;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outer);
      ctx.closePath();
      ctx.fill();
    }


    function update(dt) {
      beat += dt * 0.008;


      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.type === 'confetti' ? 0.15 : 0.02; // gravity
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life -= dt * 0.016;
        p.rot += p.rotSpeed;


        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }


      // Dancers
      for (let i = dancers.length - 1; i >= 0; i--) {
        const d = dancers[i];
        d.x += d.vx;
        d.y += d.vy;
        d.bounce = Math.sin(beat * 6 + d.phase) * 0.4 + 1;
        d.life -= dt * 0.016;


        // Bounce off walls
        if (d.x < d.size || d.x > W - d.size) d.vx *= -1;
        if (d.y < d.size || d.y > H - d.size) d.vy *= -1;


        // Attract a little toward mouse
        const dx = mouse.x - d.x;
        const dy = mouse.y - d.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 300) {
          d.vx += (dx / dist) * 0.15;
          d.vy += (dy / dist) * 0.15;
        }


        // Limit speed
        const speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
        if (speed > 8) {
          d.vx = (d.vx / speed) * 8;
          d.vy = (d.vy / speed) * 8;
        }


        if (d.life <= 0) {
          dancers.splice(i, 1);
        }
      }


      // Keep a minimum number of dancers
      if (dancers.length < 8) {
        dancers.push(createDancer(Math.random() * W, Math.random() * H));
      }


      scoreEl.textContent = `Particles: ${particles.length}  |  Dancers: ${dancers.length}`;
    }


    function draw() {
      // Fade background for trails
      ctx.fillStyle = 'rgba(10, 10, 18, 0.22)';
      ctx.fillRect(0, 0, W, H);


      // Draw particles
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);


        if (p.shape === 'star') {
          drawStar(0, 0, 5, p.size, p.size * 0.4);
        } else if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }


      // Draw dancers (glowing bouncing circles with faces)
      for (const d of dancers) {
        const s = d.size * d.bounce;
        ctx.globalAlpha = Math.min(1, d.life / 3);


        // Glow
        const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, s * 1.8);
        grad.addColorStop(0, d.color);
        grad.addColorStop(0.5, d.color + '88');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(d.x, d.y, s * 1.8, 0, Math.PI * 2);
        ctx.fill();


        // Body
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, s, 0, Math.PI * 2);
        ctx.fill();


        // Cute face
        ctx.fillStyle = '#111';
        // eyes
        ctx.beginPath();
        ctx.arc(d.x - s * 0.3, d.y - s * 0.15, s * 0.15, 0, Math.PI * 2);
        ctx.arc(d.x + s * 0.3, d.y - s * 0.15, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
        // smile
        ctx.beginPath();
        ctx.arc(d.x, d.y + s * 0.1, s * 0.35, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = s * 0.08;
        ctx.stroke();
      }


      ctx.globalAlpha = 1;
    }


    function loop(time) {
      const dt = time - lastTime || 16;
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }


    requestAnimationFrame(loop);
  </script>
</body>
</html>
